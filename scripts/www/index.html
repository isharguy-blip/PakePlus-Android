<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- W3 #280 / W4 #266：移动端状态栏随应用色（亮色主题） -->
  <meta name="theme-color" content="#ffffff">
  <!-- W4 #265：显式声明浅色配色方案（settings.theme 预留 dark 前口径唯一） -->
  <meta name="color-scheme" content="light">
  <!-- W4 #264：搜索引擎/分享场景的产品描述 -->
  <meta name="description" content="教员台——教师个人课程管理：课表、调课停课补课留痕、结算规则、统计对账与业绩记账，离线单文件可用，数据全部本地保存。">
  <!-- W4 #261：内联 SVG 日历 favicon（零外链 R1；data URI 双击 file:// 直开可用） -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='4' width='18' height='18' rx='2' fill='%232f6fed'/%3E%3Cpath d='M16 2v4M8 2v4M3 10h18' stroke='%23ffffff' stroke-width='1.8' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <title>教员台 · 个人课程管理系统</title>
  <!-- 多脚本拆分（拆分评估方案 v1.1 §5）：core → engines → panels → views → achv → main，
       全部 defer——按出现顺序执行、DOMContentLoaded 前完成、DOM 已就绪；
       依赖关系单向无环：core ← engines ← {panels, views, achv} ← main。 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- W4-B #215/#58：跳到主内容链接（键盘首个可聚焦项，:focus 时置顶可见；目标 = 各视图 <main id="mainContent">） -->
  <a class="skip-link" href="#mainContent">跳到主要内容</a>
  <!-- W4 #270：JS 禁用时不白屏，人话提示开启方式 -->
  <noscript>
    <div style="max-width:560px;margin:80px auto;padding:32px;text-align:center;
                font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
                color:#24292f;border:1px solid #e3e6ea;border-radius:12px">
      <p style="font-size:16px;font-weight:600">教员台需要启用 JavaScript 才能运行</p>
      <p style="font-size:13px;color:#59636e">请在浏览器设置中允许 JavaScript 后刷新本页；数据保存在本机浏览器中，无需联网。</p>
    </div>
  </noscript>
  <!-- 应用根节点：所有视图由 main.js 分发渲染 -->
  <div id="app"></div>
  <script src="core.js" defer></script>
  <script src="engines.js" defer></script>
  <script src="panels.js" defer></script>
  <script src="views.js" defer></script>
  <script src="achv.js" defer></script>
  <script src="main.js" defer></script>
</body>
</html>
